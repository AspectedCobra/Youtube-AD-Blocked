name: Build Windows exe
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch uBlock Origin Lite
        shell: pwsh
        run: ./fetch-ubol.ps1
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: ytonly-windows
          path: target/release/ytonly.exe
